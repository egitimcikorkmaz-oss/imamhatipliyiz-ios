name: ImamHatipliyiz
options:
  bundleIdPrefix: tr.com.imamhatipliyiz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
targets:
  ImamHatipliyiz:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - '*.swift'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.com.imamhatipliyiz.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: İmam Hatipliyiz
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
