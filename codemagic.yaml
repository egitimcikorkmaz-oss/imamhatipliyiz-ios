
workflows:
  ios-simulator-check:
    name: Imam Hatipliyiz - Simulator build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: ImamHatipliyiz.xcodeproj
        XCODE_SCHEME: ImamHatipliyiz
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator (no signing)
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-testflight:
    name: Imam Hatipliyiz - TestFlight IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: ImamHatipliyiz-Apple

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tr.com.imamhatipliyiz.app
      vars:
        XCODE_PROJECT: ImamHatipliyiz.xcodeproj
        XCODE_SCHEME: ImamHatipliyiz

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate versioned Xcode project
        script: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path("project.yml")
          target = pathlib.Path("project.testflight.yml")

          if not source.is_file():
              raise SystemExit("project.yml bulunamadi")

          content = source.read_text(encoding="utf-8")

          build_number = os.environ.get(
              "BUILD_NUMBER",
              "5"
          )

          if not build_number.isdigit():
              raise SystemExit("Gecersiz build number")

          pattern = (
              r"(?m)^(\s*CURRENT_PROJECT_VERSION:\s*)"
              r"['\"]?\d+['\"]?\s*$"
          )

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + build_number,
              content
          )

          if count == 0:
              raise SystemExit(
                  "project.yml icinde "
                  "CURRENT_PROJECT_VERSION bulunamadi"
              )

          target.write_text(
              updated,
              encoding="utf-8"
          )

          print("Build number:", build_number)
          print("Project spec generated:", target)
          PY

          xcodegen generate --spec project.testflight.yml

      - name: Apply App Store provisioning profile
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
